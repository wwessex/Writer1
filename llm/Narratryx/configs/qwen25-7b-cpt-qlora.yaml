base_model: Qwen/Qwen2.5-7B-Instruct
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer
trust_remote_code: true

load_in_4bit: true
adapter: qlora

sequence_len: 4096
sample_packing: true
pad_to_sequence_len: true

# Continued pretraining on Gutenberg fiction chunks to adapt
# the base model's language distribution toward literary prose.
datasets:
  - path: artifacts/data/pretrain_chunks.jsonl
    type: completion
    field: text
val_set_size: 0.01
output_dir: artifacts/checkpoints/qwen25-7b-cpt

lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_linear: true

micro_batch_size: 2
gradient_accumulation_steps: 8
num_epochs: 1
optimizer: paged_adamw_8bit
learning_rate: 0.0001
lr_scheduler: cosine
warmup_ratio: 0.05

train_on_inputs: true
group_by_length: true
bf16: auto
tf32: true

logging_steps: 10
save_steps: 500
save_total_limit: 2
