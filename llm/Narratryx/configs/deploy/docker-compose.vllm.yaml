version: "3.9"
services:
  vllm:
    image: vllm/vllm-openai:latest
    command: >
      --model /models/narratryx
      --host 0.0.0.0
      --port 8000
      --max-model-len 32768
    ports:
      - "8000:8000"
    volumes:
      - ../../artifacts/checkpoints/qwen25-7b-dpo:/models/narratryx
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
