<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="280" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C1928"/>
      <stop offset="1" stop-color="#070E18"/>
    </linearGradient>

    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8FE9FF"/>
      <stop offset="0.5" stop-color="#5DD8F8"/>
      <stop offset="1" stop-color="#2EC6FF"/>
    </linearGradient>

    <linearGradient id="fgFill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8FE9FF"/>
      <stop offset="1" stop-color="#2EC6FF"/>
    </linearGradient>

    <filter id="iconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feColorMatrix in="glow" type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.85  0 0 0 0 1  0 0 0 0.2 0" result="coloredGlow"/>
      <feMerge>
        <feMergeNode in="coloredGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon (softer corners) -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="280" height="280" rx="72" fill="url(#bg)"/>
    <g filter="url(#iconGlow)">
      <g stroke="url(#fg)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M70 135c20-55 65-86 110-86s90 31 110 86" opacity="0.7"/>
        <path d="M140 88h40l-8 20h-24l-8-20z"/>
        <path d="M110 118h100" opacity="0.75"/>
        <path d="M140 120c24 0 44 20 44 44v82c0 12-5 20-14 29l-20 22 q-10 10-20 0 l-20-22c-9-9-14-17-14-29v-82c0-24 20-44 44-44z"/>
        <path d="M140 160v64" opacity="0.8"/>
        <path d="M113 152l-18-7" opacity="0.6"/>
        <path d="M167 152l18-7" opacity="0.6"/>
        <path d="M70 210c20 12 40 12 60 0s40-12 60 0 40 12 60 0 40-12 60 0" opacity="0.9"/>
        <path d="M70 238c20 12 40 12 60 0s40-12 60 0 40 12 60 0 40-12 60 0" opacity="0.8"/>
      </g>
      <circle cx="140" cy="190" r="6" fill="url(#fgFill)"/>
    </g>
  </g>

  <!-- Wordmark (dark text for light backgrounds) -->
  <g transform="translate(340,80)">
    <text x="0" y="90"
      font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial"
      font-size="92" font-weight="800" fill="#0A1520" letter-spacing="-0.5">
      DraftHarbour
    </text>
    <text x="3" y="158"
      font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial"
      font-size="60" font-weight="600" fill="#2E4A5C" letter-spacing="1.5">
      Studio
    </text>
  </g>
</svg>
