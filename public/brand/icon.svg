<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="440" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1F33"/>
      <stop offset="1" stop-color="#07121F"/>
    </linearGradient>

    <linearGradient id="fg" x1="170" y1="120" x2="350" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8FE9FF"/>
      <stop offset="1" stop-color="#2EC6FF"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="40" y="40" width="432" height="432" rx="96" fill="url(#bg)"/>

  <!-- Emblem -->
  <g filter="url(#softGlow)" stroke="url(#fg)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Arc / harbour horizon -->
    <path d="M152 238c30-78 92-122 152-122s122 44 152 122" opacity="0.75"/>

    <!-- Pen-nib lighthouse body -->
    <path d="M256 158
             c34 0 62 28 62 62
             v116
             c0 18-8 30-20 42
             l-42 46
             l-42-46
             c-12-12-20-24-20-42
             V220
             c0-34 28-62 62-62z"/>

    <!-- Nib slit + breather hole -->
    <path d="M256 212v92" opacity="0.85"/>
    <circle cx="256" cy="252" r="10" fill="url(#fg)" stroke="none"/>

    <!-- Lighthouse cap -->
    <path d="M232 132h48l-10 26h-28l-10-26z"/>
    <path d="M212 170h88" opacity="0.8"/>

    <!-- Light beams -->
    <path d="M188 150l-28-10" opacity="0.7"/>
    <path d="M324 150l28-10" opacity="0.7"/>

    <!-- Waves -->
    <path d="M152 332c26 16 52 16 78 0s52-16 78 0 52 16 78 0 52-16 78 0" opacity="0.95"/>
    <path d="M152 366c26 16 52 16 78 0s52-16 78 0 52 16 78 0 52-16 78 0" opacity="0.85"/>
    <path d="M152 400c26 16 52 16 78 0s52-16 78 0 52 16 78 0 52-16 78 0" opacity="0.75"/>
  </g>
</svg>
