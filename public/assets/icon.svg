<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="beacon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nib-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="arch-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0f172a"/>

  <!-- Harbor arch -->
  <path d="M 128 388 C 128 200, 256 130, 256 130 C 256 130, 384 200, 384 388"
        stroke="url(#arch-grad)" stroke-width="16" fill="none" stroke-linecap="round"/>

  <!-- Beacon glow -->
  <ellipse cx="256" cy="128" rx="65" ry="50" fill="url(#beacon-glow)"/>

  <!-- Pen nib / lighthouse body - left tine -->
  <path d="
    M 256 400
    C 248 365, 228 295, 218 235
    C 212 200, 215 172, 224 155
    L 232 144
    L 244 144
    C 248 162, 250 185, 252 215
    L 256 325
    Z
  " fill="url(#nib-grad)"/>

  <!-- Pen nib / lighthouse body - right tine -->
  <path d="
    M 256 400
    C 264 365, 284 295, 294 235
    C 300 200, 297 172, 288 155
    L 280 144
    L 268 144
    C 264 162, 262 185, 260 215
    L 256 325
    Z
  " fill="url(#nib-grad)"/>

  <!-- Nib slit -->
  <line x1="256" y1="320" x2="256" y2="215" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>

  <!-- Breather hole -->
  <circle cx="256" cy="298" r="7" fill="#0f172a"/>

  <!-- Lighthouse beacon -->
  <circle cx="256" cy="126" r="16" fill="#fbbf24"/>
  <circle cx="256" cy="126" r="10" fill="#fde68a"/>

  <!-- Light rays -->
  <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="256" y1="99" x2="256" y2="85"/>
    <line x1="234" y1="107" x2="224" y2="96"/>
    <line x1="278" y1="107" x2="288" y2="96"/>
    <line x1="228" y1="123" x2="216" y2="119"/>
    <line x1="284" y1="123" x2="296" y2="119"/>
  </g>

  <!-- Waves -->
  <path d="M 96 382 Q 140 364, 176 382 Q 216 400, 256 382 Q 296 364, 336 382 Q 376 400, 416 382"
        stroke="#06b6d4" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M 96 406 Q 140 388, 176 406 Q 216 424, 256 406 Q 296 388, 336 406 Q 376 424, 416 406"
        stroke="#0ea5e9" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M 112 428 Q 152 412, 188 428 Q 224 444, 256 428 Q 288 412, 324 428 Q 360 444, 400 428"
        stroke="#38bdf8" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.35"/>
</svg>
