name: Desktop Release Pipeline

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options: [stable, beta, nightly]

permissions:
  contents: read

jobs:
  desktop-build:
    name: Desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    env:
      RELEASE_CHANNEL: ${{ inputs.channel }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build signed desktop artifact
        run: npm run desktop:build -- --target ${{ matrix.target }}
      - name: Generate checksums
        shell: bash
        run: |
          cd desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          find . -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.exe' \) -exec sha256sum {} \; > checksums.txt
      - name: Sign checksum manifest
        shell: bash
        run: |
          cd desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          echo "${{ secrets.RELEASE_SIGNING_KEY }}" > private_key.pem
          openssl dgst -sha256 -sign private_key.pem -out checksums.sig checksums.txt
      - name: Verify signed checksums
        shell: bash
        run: |
          cd desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          echo "${{ secrets.RELEASE_SIGNING_PUBKEY }}" > public_key.pem
          openssl dgst -sha256 -verify public_key.pem -signature checksums.sig checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}-${{ inputs.channel }}
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle

  promote-release:
    name: Verify artifacts before promotion
    runs-on: ubuntu-latest
    needs: desktop-build
    if: ${{ inputs.channel != 'nightly' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Verify checksum signatures
        shell: bash
        run: |
          failed=0
          for d in artifacts/*; do
            [ -d "$d" ] || continue
            echo "Verifying $d"
            echo "${{ secrets.RELEASE_SIGNING_PUBKEY }}" > "$d/public_key.pem"
            openssl dgst -sha256 -verify "$d/public_key.pem" -signature "$d/checksums.sig" "$d/checksums.txt" || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "Signature verification failed"
            exit 1
          fi
      - name: Promote release
        run: echo "All signed artifacts verified for ${{ inputs.channel }}. Safe to promote."
